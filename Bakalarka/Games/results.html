<!DOCTYPE html>
<html lang="cs">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hodnocení hráče</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      padding: 20px;
      background-color: #1a1a2e; /* Tmavé herní pozadí */
      color: #e0dfff; /* Světle fialový text */
      max-width: 800px;
      margin: auto;
      text-align: center;
    }

    h1 {
      color: #7a69ff; /* Jasnější fialová */
    }

    .score {
      font-size: 20px;
      margin: 10px 0;
    }

    .grade {
      font-size: 22px;
      margin-top: 20px;
      font-weight: bold;
      color: #ffffff;
    }

    .grade-img {
      margin: 25px auto 0 auto;
      max-width: 100%;
      height: auto;
      border-radius: 15px;
      border: 3px solid #6441a5; /* Fialový rámeček */
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      display: block;
    }

    .start-button {
      display: block;
      margin: 40px auto 0 auto;
      padding: 12px 30px;
      font-size: 18px;
      background-color: #5a4dcf; /* Tlačítková fialová */
      color: white;
      border: 2px solid #3a2c8d;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .start-button:hover {
      background-color: #7a69ff;
      transform: scale(1.05);
    }

    .contact-footer {
      position: fixed;
      bottom: 10px;
      right: 10px;
      font-size: 12px;
      color: rgba(224, 223, 255, 0.6);
      background-color: rgba(26, 26, 46, 0.8);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(122, 105, 255, 0.3);
      pointer-events: none; /* Aby nebránil klikání, pokud by byl přes něco */
    }
  </style>
</head>

<body>

  <h1>🎯 Tvůj výsledek</h1>
  <p class="score">Skóre: <span id="scoreDisplay">0</span> / 21</p>
  <p class="grade" id="gradeDisplay"></p>
  <img id="gradeImage" class="grade-img" src="" alt="Výsledek" style="display: none;" />

  <button class="start-button" onclick="window.location.href='index.html'">
    🔙 Vrátit se do menu
  </button>

  <div class="contact-footer">
    Pro nahlášení chyb mě kontaktujte na: <strong>mattravencz@gmail.com</strong>
  </div>

  <script>
    // Migrate old score if it exists
    const oldScore = localStorage.getItem('playerScore');
    if (oldScore !== null) {
      localStorage.setItem('totalScore', oldScore);
      localStorage.removeItem('playerScore');
    }

    const score = parseInt(localStorage.getItem('totalScore')) || 0;
    document.getElementById('scoreDisplay').textContent = score;

    let gradeSentence = '';
    let imageUrl = '';

    if (score >= 18) {
      gradeSentence = 'Skvělý výkon! Tvoje výsledky jsou opravdu vynikající a ukazují, že máš výborný základ a jen tak někdo si na tebe nepřijde. Velká gratulace!';
      imageUrl = 'https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExMGVkZ3o2M2NhM2NpZTl4YTh6cXA2Y2hicG9ucjZmbjZ0ZGsyMW4xYiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/7FyMQm2vBiTjG/giphy.gif';
    } else if (score >= 14) {
      gradeSentence = 'Velmi dobré! Dosáhl jsi solidního výsledku a je vidět, že tomu rozumíš. Trocha doladění a můžeš dosáhnout ještě lepších výsledků.';
      imageUrl = 'https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif';
    } else if (score >= 10) {
      gradeSentence = 'Slušný výkon, ještě to chce doladit! Už máš dobrý základ, ale určitě se vyplatí věnovat pozornost detailům a zlepšit některé oblasti.';
      imageUrl = 'https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExMW11MmNqZ3Z5am9jdm1tdzk0dGR3eGcyMGZtdGE4YWp0N3pva2cwNyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/7ZjmsISzWnreE/giphy.gif';
    } else {
      gradeSentence = 'Nevadí, příště to bude lepší! Každý začátek je těžký a je důležité nevzdávat se. Uč se dál a příště dosáhneš lepších výsledků!';
      imageUrl = 'https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExYnUxZWxsa25ydGU2cG1yOTBwc3l0djZld3Nqcm9xY3BlNHdmbWtsdCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/116a8zosxwA0SI/giphy.gif';
    }

    document.getElementById('gradeDisplay').textContent = `Hodnocení: ${gradeSentence}`;

    const img = document.getElementById('gradeImage');
    img.src = imageUrl;
    img.style.display = 'block';
  </script>

</body>

</html>
