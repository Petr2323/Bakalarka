<!DOCTYPE html>
<html lang="en">

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="js/emailGameScene.js"></script>

  <title>Email Phishing</title>

  <style>
    body {
      margin: 0;

      background-size: cover;

        parent: 'game-container',
        scene: [ EmailGameScene ] // Registrace tvé scény ze souboru js/emailGameScene.js

    // Oficiální start hry
