<!DOCTYPE html>
<html lang="cs">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.0/dist/phaser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/linkGame.js"></script>

  <title>Podezřelé odkazy</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-image: url('assets/purpleBackgroundHTML.webp');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      /* Vycentrování herního kontejneru na střed */
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-container {
      /* Zajištění ostrosti pixelů, pokud by se hra škálovala */
      image-rendering: pixelated;
    }
  </style>
</head>

<body>
  <div id="game-container"></div>
</body>

</html>
