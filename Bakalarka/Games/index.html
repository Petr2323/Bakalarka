<!DOCTYPE html>
<html lang="cs">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kyberbezpečnostní hry</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f2f2f2;
      color: #333;
      max-width: 800px;
      margin: auto;
      text-align: center;
    }

    h1 {
      color: #0073e6;
    }

    .intro {
      font-size: 18px;
      margin: 20px 0 30px;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }

    .menu button {
      padding: 12px 30px;
      font-size: 18px;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .menu button:hover {
      background-color: #0056b3;
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <h1>Kyberbezpečnostní hry</h1>
  <p class="intro">
    Než začneš hrát, doporučuji si nejprve přečíst sekci <strong>Nápověda</strong>, kde najdeš důležité informace ke hře.
  </p>

  <div class="menu">
    <button onclick="location.href='emailGame.html'">🎮 Začni hrát</button>
    <button onclick="location.href='tutorial.html'">📘 Nápověda</button>
  </div>

  <script>
    if (localStorage.getItem('playerScore') !== null) localStorage.removeItem('playerScore');
  </script>

</body>

</html>
