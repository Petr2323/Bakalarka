<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Welcome to Bakalarka Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 2em;
      background: #f0f8ff;
      color: #333;
    }
    h1 {
      color: #2a7ae2;
    }
    p {
      font-size: 1.2em;
      margin: 1em auto 2em;
      max-width: 400px;
    }
    button {
      background-color: #2a7ae2;
      color: white;
      border: none;
      padding: 1em 2em;
      font-size: 1.2em;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #195bb5;
    }
  </style>
</head>
<body>
  <h1>Welcome to the Bakalarka Game!</h1>
  <p>This fun game is designed especially for kids. Click the button below to start playing.</p>
  <button onclick="startGame()">Start the Game</button>

  <script>
    function startGame() {
      window.location.href = './Games/index.html';
    }
  </script>
</body>
</html>
